<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin | KBC</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">

  <main class="login-container">
    <div class="login-logo">KBC</div>
    <h1>Administration</h1>
    <p>Connectez-vous pour gérer votre boutique.</p>

    <form id="login-form">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required autocomplete="username"
             placeholder="admin@exemple.com">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required
             autocomplete="current-password" placeholder="Votre mot de passe">

      <button type="submit" id="login-button">Se connecter</button>
      <p id="login-message" role="alert"></p>
    </form>

    <a href="../index.html" class="back-link">Retour à la boutique</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
